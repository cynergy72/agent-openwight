# config.toml 로 복사해서 사용하세요. (config.toml 은 git 에 올라가지 않습니다)

[llm]
# OpenAI 호환 엔드포인트면 무엇이든 됩니다: Ollama, vLLM, llama.cpp server, LM Studio
base_url = "http://localhost:11434/v1"
# 기본: Qwen3.8-27B (dense). 태그 이름은 `ollama list` 또는 Ollama 라이브러리에서 확인하세요.
# 응답이 너무 느리면 MoE 모델로: "qwen3-coder:30b" (활성 3.3B, 훨씬 빠름)
model = "qwen3.8:27b"
api_key = "ollama"          # Ollama 는 아무 값이나 OK
temperature = 0.1
max_tokens = 8192           # thinking 모드는 추론에도 토큰을 쓰므로 넉넉하게
timeout = 300

# 서버별 추가 요청 필드 (선택). 예: vLLM 에서 thinking 끄기
# [llm.extra_body]
# chat_template_kwargs = { enable_thinking = false }

[agent]
max_steps = 12              # 한 요청당 최대 도구 호출 단계
max_fix_rounds = 2          # 자동 검증 실패 시 재작성 시도 횟수
history_turns = 6           # 다음 요청에 넘겨줄 이전 대화 수 (수정 요청용)
tool_output_chars = 6000    # 도구 결과를 모델에 넘길 때 최대 길이
knowledge_dir = "knowledge" # 용어집·예시 쿼리 (.md)
schema_dir = "schema"       # DDL 파일(.sql) 또는 sync-schema 결과(.json)

[teradata]
enabled = false             # true 면 EXPLAIN 검증 / 메타데이터 조회 사용
host = "tdprod.example.com"
user = "my_user"
# password 는 환경변수 TD_PASSWORD 로 넣는 것을 권장합니다
logmech = "TD2"             # 또는 "LDAP"
databases = ["SALES_DB", "CUST_DB"]  # sync-schema 대상
allow_execute = false       # true 면 에이전트가 SELECT 를 직접 실행 (읽기 전용만)
max_rows = 50

[tuning]
max_iterations = 5          # 목표 달성까지 재작성 최대 시도 횟수
patience = 2                # 연속 개선 없음 N회면 중단
helpstats = true            # EXPLAIN 전에 DIAGNOSTIC HELPSTATS ON FOR SESSION (통계 권고 수집)
# 탐지 임계값 (EXPLAIN 예상 행 수)
dup_rows = 1000000          # 이 이상 복제되면 DUPLICATE_LARGE
redistribute_rows = 10000000
scan_rows = 1000000         # 파티션 없는 전체 스캔 결과가 이 이상이면 FULL_SCAN_LARGE
spool_rows = 100000000
# DBQL / 테이블 지표 임계값
cpu_skew_warn = 2.0
cpu_skew_crit = 5.0
table_skew_warn = 20.0      # %
table_skew_crit = 50.0

[dbql]
log_table = "DBC.DBQLogTbl" # PDCR 이력 테이블을 쓰면 예: "PDCRINFO.DBQLogTbl_Hst"
sql_table = "DBC.DBQLSqlTbl"
