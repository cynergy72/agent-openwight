# config.toml 로 복사해서 사용하세요. (config.toml 은 git 에 올라가지 않습니다)

[llm]
# OpenAI 호환 엔드포인트면 무엇이든 됩니다: Ollama, vLLM, llama.cpp server, LM Studio
base_url = "http://localhost:11434/v1"
model = "qwen3-coder:30b"
api_key = "ollama"          # Ollama 는 아무 값이나 OK
temperature = 0.1
max_tokens = 4096
timeout = 300

[agent]
max_steps = 12              # 한 요청당 최대 도구 호출 단계
max_fix_rounds = 2          # 자동 검증 실패 시 재작성 시도 횟수
history_turns = 6           # 다음 요청에 넘겨줄 이전 대화 수 (수정 요청용)
tool_output_chars = 6000    # 도구 결과를 모델에 넘길 때 최대 길이
knowledge_dir = "knowledge" # 용어집·예시 쿼리 (.md)
schema_dir = "schema"       # DDL 파일(.sql) 또는 sync-schema 결과(.json)

[teradata]
enabled = false             # true 면 EXPLAIN 검증 / 메타데이터 조회 사용
host = "tdprod.example.com"
user = "my_user"
# password 는 환경변수 TD_PASSWORD 로 넣는 것을 권장합니다
logmech = "TD2"             # 또는 "LDAP"
databases = ["SALES_DB", "CUST_DB"]  # sync-schema 대상
allow_execute = false       # true 면 에이전트가 SELECT 를 직접 실행 (읽기 전용만)
max_rows = 50
